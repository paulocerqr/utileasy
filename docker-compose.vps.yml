services:
  backend:
    mem_limit: 1g
    cpus: 1.00

  worker:
    container_name: utilitydev-worker-media
    mem_limit: 2560m
    cpus: 2.00
    command: >-
      celery -A config worker --loglevel=INFO --pool=prefork
      --concurrency=${VPS_MEDIA_CONCURRENCY:-2}
      -Q media --hostname=media@%h

  worker-provider:
    build:
      context: ./backend
    container_name: utilitydev-worker-provider
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
    volumes:
      - transcription_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    mem_limit: 1g
    cpus: 1.00
    command: >-
      celery -A config worker --loglevel=INFO --pool=prefork
      --concurrency=${VPS_PROVIDER_CONCURRENCY:-2}
      -Q provider,maintenance --hostname=provider@%h

  beat:
    build:
      context: ./backend
    container_name: utilitydev-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    command: celery -A config beat --loglevel=INFO

  frontend:
    mem_limit: 1g
    cpus: 0.75

  caddy:
    image: caddy:2-alpine
    container_name: utilitydev-caddy
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    mem_limit: 256m
    cpus: 0.25

volumes:
  caddy_data:
  caddy_config:
