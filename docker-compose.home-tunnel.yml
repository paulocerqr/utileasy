x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *bounded-logging

  redis:
    logging: *bounded-logging

  backend:
    logging: *bounded-logging
    environment:
      DJANGO_TRUST_PROXY_HEADERS: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request(
          "http://127.0.0.1:8000/api/health/", headers={"Host": "backend"});
          urllib.request.urlopen(request, timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    logging: *bounded-logging
    depends_on:
      backend:
        condition: service_healthy

  beat:
    logging: *bounded-logging
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    ports: !reset []
    expose:
      - "3000"
    environment:
      TRUSTED_REVERSE_PROXY: "1"
    logging: *bounded-logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/login")
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    build:
      context: ./deploy/caddy-home
    image: utileazy-caddy-home:2.11.4
    container_name: utilitydev-caddy-home
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN must be configured}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./deploy/Caddyfile.home-tunnel:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config:mode=700,uid=${PUID:-1000},gid=${PGID:-1000}
      - /data:mode=700,uid=${PUID:-1000},gid=${PGID:-1000}
      - /tmp:mode=700,uid=${PUID:-1000},gid=${PGID:-1000}
    expose:
      - "8080"
    networks:
      - default
      - tunnel_edge
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --header
        - "Host: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN must be configured}"
        - http://127.0.0.1:8080/login
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 192m
    cpus: 0.20
    logging: *bounded-logging

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    container_name: utilitydev-cloudflared
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - run
    secrets:
      - cloudflare_tunnel_token
    tmpfs:
      - /tmp:mode=700,uid=${PUID:-1000},gid=${PGID:-1000}
    networks:
      - tunnel_edge
    depends_on:
      caddy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 192m
    cpus: 0.25
    logging: *bounded-logging

networks:
  tunnel_edge:
    driver: bridge

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./secrets/cloudflare-tunnel-token}
