---
- name: Validar backup e habilitar rotina apos testes publicos
  hosts: oracle
  become: true
  gather_facts: false
  tasks:
    - name: Exigir validacao funcional de producao
      ansible.builtin.assert:
        that:
          - production_verified | default(false) | bool
        fail_msg: "Teste HTTPS, autenticacao, Turnstile, transcricao e documentos; depois use -e production_verified=true."

    - name: Exigir configuracoes de recuperacao existentes
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/utileazy-backup.conf
        - /etc/utileazy-restic-password
        - /etc/default/utileazy-alerts
      register: backup_files
      no_log: true

    - name: Confirmar configuracao completa
      ansible.builtin.assert:
        that:
          - backup_files.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: "Instale configuracoes de backup antes de habilitar a rotina."

    - name: Fazer backup e esperar o termino
      ansible.builtin.command: /usr/local/sbin/utileazy-backup backup
      changed_when: true
      no_log: true

    - name: Testar restore somente depois do backup
      ansible.builtin.command: /usr/local/sbin/utileazy-backup-restore-test
      changed_when: true
      no_log: true

    - name: Habilitar timers somente depois dos dois sucessos
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - utileazy-backup.timer
        - utileazy-backup-restore-test.timer
        - utileazy-backup-maintenance.timer
        - utileazy-soak-check.timer

    - name: Executar monitor sem enviar alerta de teste
      ansible.builtin.systemd_service:
        name: utileazy-soak-check.service
        state: started
