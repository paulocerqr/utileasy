---
- name: Construir e testar ARM64 sem iniciar produtores ou tunnel
  hosts: oracle
  become: true
  tasks:
    - name: Exigir execucao real para validar builds
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - ansible_facts.architecture == 'aarch64'
        fail_msg: "Esta validacao precisa executar containers na Oracle ARM64; --check nao testa compatibilidade."

    - name: Consultar disco disponivel no checkout
      ansible.builtin.command:
        argv: [df, -B1, --output=avail, "{{ app_dir }}"]
      register: disk_free
      changed_when: false

    - name: Exigir folga minima para os builds
      ansible.builtin.assert:
        that:
          - disk_free.stdout_lines[-1] | trim | int >= (minimum_disk_free_gib | int * 1024 * 1024 * 1024)

    - name: Validar configuracao Compose
      ansible.builtin.command:
        argv: "{{ compose_argv + ['config', '--quiet'] }}"
      changed_when: false
      no_log: true

    - name: Verificar imagens nativas de runtime sem iniciar containers
      ansible.builtin.command:
        argv: [docker, pull, --platform, linux/arm64, "{{ item }}"]
      loop:
        - postgres:16-alpine
        - redis:7-alpine
        - caddy:2.11.4-alpine
        - cloudflare/cloudflared:2026.7.2
      register: pulled_image
      changed_when: "'Downloaded newer image' in pulled_image.stdout"

    - name: Construir servicos e imagem de testes
      ansible.builtin.command:
        argv: "{{ compose_argv + ['build', 'backend', 'worker', 'worker-provider', 'worker-documents', 'beat', 'frontend', 'frontend-check', 'caddy'] }}"
      changed_when: true

    - name: Testar imports e ferramentas no container Debian ARM64
      ansible.builtin.command:
        argv: >-
          {{ compose_argv + ['run', '--rm', '--no-deps', '-T', 'backend',
          'sh', '-ec', 'test $(uname -m) = aarch64; python -m pip check;
          ffmpeg -version; libreoffice --version;
          python -c "import django, celery, psycopg, pymupdf, pdf2docx, PIL, docx, reportlab"'] }}
      changed_when: false

    - name: Testar conversoes reais sem dados de usuarios
      ansible.builtin.command:
        argv: "{{ compose_argv + ['run', '--rm', '--no-deps', '-T', 'backend', 'python', '-'] }}"
        stdin: "{{ lookup('ansible.builtin.file', 'tests/documents_arm64.py') }}"
      changed_when: false

    - name: Validar Caddyfile Oracle
      ansible.builtin.command:
        argv: "{{ compose_argv + ['run', '--rm', '--no-deps', '-T', 'caddy', 'caddy', 'validate', '--config', '/etc/caddy/Caddyfile', '--adapter', 'caddyfile'] }}"
      changed_when: false

    - name: Conferir curl exigido pelo healthcheck Caddy
      ansible.builtin.command:
        argv: "{{ compose_argv + ['run', '--rm', '--no-deps', '-T', 'caddy', 'sh', '-ec', 'command -v curl'] }}"
      changed_when: false

    - name: Testar frontend e verificacao TypeScript
      ansible.builtin.command:
        argv: "{{ compose_argv + ['run', '--rm', '--no-deps', '-T', 'frontend-check', 'pnpm', item] }}"
      loop: [lint, test]
      changed_when: false
