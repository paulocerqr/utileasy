services:
  db:
    image: postgres:16-alpine
    container_name: utilitydev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utilitydev}
      POSTGRES_USER: ${POSTGRES_USER:-utilitydev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-utilitydev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: utilitydev-redis
    restart: unless-stopped
    command: >-
      redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: utilitydev-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
    volumes:
      - transcription_media:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"

  worker:
    build:
      context: ./backend
    container_name: utilitydev-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
    volumes:
      - transcription_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: >-
      celery -A config worker --loglevel=INFO --pool=solo --concurrency=1

  frontend:
    build:
      context: ./frontend
    container_name: utilitydev-frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE_URL: http://backend:8000
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:3000:3000"
    depends_on:
      - backend
    command: pnpm start --hostname 0.0.0.0

  frontend-check:
    build:
      context: ./frontend
      target: checker
    command: pnpm lint

volumes:
  postgres_data:
  redis_data:
  transcription_media:
