services:
  db:
    image: postgres:16-alpine
    container_name: utilitydev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utilitydev}
      POSTGRES_USER: ${POSTGRES_USER:-utilitydev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-utilitydev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: utilitydev-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

  frontend:
    build:
      context: ./frontend
    container_name: utilitydev-frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE_URL: http://backend:8000
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:3000:3000"
    depends_on:
      - backend
    command: pnpm start --hostname 0.0.0.0

volumes:
  postgres_data:
frontend/public/fundo.pngFONT