services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    command: >-
      celery -A config worker --loglevel=INFO --pool=prefork --concurrency=2
      -Q media,provider,documents,maintenance

  frontend:
    build:
      target: development
    command: pnpm dev --hostname 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
